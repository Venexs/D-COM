<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>D-COM v4.77 // ARG Chapter Six — Final Record</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--void:#04070d;--panel:#09111b;--line:#17374a;--ice:#7de9ff;--mint:#6dffb0;--mag:#e45cff;--amb:#ffb347;--red:#ff4d5e;--tx:#bcd6e2;--dim:#5f8296;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 0,#0b1b2b,var(--void) 70%);color:var(--tx);font:13.5px/1.55 "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:20;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.55))}
.app{height:100%;display:grid;grid-template-rows:auto 1fr}
header{display:flex;gap:18px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--line);font-family:"Chakra Petch",sans-serif}
.logo{font-size:20px;letter-spacing:.14em;color:var(--ice);text-shadow:0 0 14px rgba(125,233,255,.6)}
.logo small{font-size:12px;color:var(--dim);letter-spacing:.05em}
.sp{flex:1}
#sess,#clk{color:var(--dim);font-size:12px}
main{display:grid;grid-template-columns:232px minmax(0,1fr) 264px;gap:10px;padding:10px;min-height:0}
.p{position:relative;border:1px solid var(--line);background:linear-gradient(var(--panel),#070d15);min-height:0;overflow:hidden}
.p::before,.p::after{content:"";position:absolute;width:11px;height:11px;border:2px solid var(--ice);pointer-events:none;z-index:2}
.p::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.p::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.t{font:700 12px "Chakra Petch",sans-serif;letter-spacing:.1em;color:var(--ice);padding:7px 12px;border-bottom:1px solid var(--line);background:rgba(125,233,255,.04)}
aside .t:not(:first-child){border-top:1px solid var(--line)}
.mod{display:flex;justify-content:space-between;align-items:center;width:100%;padding:9px 12px;border:0;border-bottom:1px solid #0f2230;background:none;color:var(--tx);font:inherit;cursor:pointer;text-align:left}
.mod:hover{background:rgba(125,233,255,.08)}
.mod em{font-style:normal;font-size:11px;color:var(--mint)}
.mod.no{color:var(--dim)}.mod.no em{color:var(--red)}
.lock{padding:12px;color:var(--dim)}
#links{list-style:none;margin:0;padding:6px 12px}
#links li{display:flex;align-items:center;gap:9px;padding:3px 0;color:var(--dim)}
#links i{width:8px;height:8px;border-radius:50%;background:var(--dim)}
#links .ok{color:var(--tx)}#links .ok i{background:var(--mint);box-shadow:0 0 8px var(--mint)}
#links .bad{color:var(--red)}#links .bad i{background:var(--red);box-shadow:0 0 8px var(--red)}
#mid{display:grid;grid-template-rows:minmax(0,1.1fr) minmax(0,1fr);gap:10px;min-height:0}
#cv{position:absolute;left:0;top:31px;width:100%;height:calc(100% - 31px);transition:opacity .4s}
#view{position:relative;height:calc(100% - 31px);overflow:auto;padding:14px}
.home h1{font:700 30px "Chakra Petch",sans-serif;letter-spacing:.12em;color:var(--ice);margin:0 0 6px;text-shadow:0 0 18px rgba(125,233,255,.5)}
.home p{max-width:46ch;margin:0;color:var(--tx)}
code{color:var(--amb)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.kv small{color:var(--dim)}
.big{display:block;font:700 34px "Chakra Petch",sans-serif;color:var(--ice)}
.big.hot,.hot b{color:var(--amb)}
.bar{height:7px;background:#0d1d2b;margin-top:5px;background-image:repeating-linear-gradient(90deg,transparent 0 6px,var(--panel) 6px 8px)}
.bar i{display:block;height:100%;background:var(--ice);box-shadow:0 0 10px var(--ice);transition:width .8s}
.hot .bar i,.big.hot+.bar i{background:var(--amb);box-shadow:0 0 10px var(--amb)}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 18px;margin:16px 0}dt{color:var(--dim)}dd{margin:0}
.warn{color:var(--amb)}
.ctl{display:flex;gap:10px;flex-wrap:wrap}
.ctl label{color:var(--dim)}
.ctl input{width:90px;background:#050b12;border:1px solid var(--line);color:var(--ice);font:inherit;padding:4px 6px;margin-left:4px}
button{font:inherit;cursor:pointer}
.ctl button,.dc button,.chips button,#rc{background:none;border:1px solid var(--line);color:var(--ice);padding:3px 9px}
.ctl button:hover,.dc button:hover,.chips button:hover,#rc:hover,.chips .on{background:rgba(125,233,255,.14);border-color:var(--ice)}
.dg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.dc{border:1px solid var(--line);padding:10px;display:grid;gap:6px}
.dc b{font-family:"Chakra Petch",sans-serif;color:var(--ice);letter-spacing:.08em}
.dc em{font-style:normal;color:var(--mint);font-size:12px}
.dc div{display:flex;flex-wrap:wrap;gap:4px}.dc button{font-size:11px;padding:2px 7px}
.dc.x{opacity:.4}.dc.x em{color:var(--red)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.lh{display:flex;gap:18px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:8px;color:var(--dim)}
.lh b{color:var(--amb);font-family:"Chakra Petch",sans-serif;letter-spacing:.08em}
.le{padding:3px 0}.le time{color:var(--ice);margin-right:12px}.le.end{color:var(--dim)}
.rd{background:var(--tx);color:var(--tx);padding:0 3px;cursor:not-allowed}
#termp{display:grid;grid-template-rows:auto 1fr auto}
#term{overflow:auto;padding:8px 12px}
.l{white-space:pre-wrap;word-break:break-word}
.l.ok{color:var(--mint)}.l.err{color:var(--red)}.l.c{color:var(--ice)}.l.warn{color:var(--amb)}.l.u{color:var(--dim)}
.inrow{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--line)}
.inrow span{color:var(--ice)}
#in{flex:1;background:none;border:0;color:var(--tx);font:inherit;outline:0;caret-color:var(--ice)}
.tr{padding:8px 12px;border-bottom:1px solid #0f2230}
.tr span{color:var(--dim);display:block;font-size:12px}.tr b{font-weight:500}
#feed{padding:8px 12px;color:#2f6a82;font-size:11.5px;overflow:hidden;height:calc(100% - 0px)}
#fp{display:grid;grid-template-rows:auto auto auto 1fr}
#right{display:grid;grid-template-rows:auto auto 1fr;min-height:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
#alert{position:fixed;inset:0;background:rgba(36,0,6,.94);display:grid;place-content:center;gap:18px;justify-items:center;z-index:30;color:var(--red);padding:20px}
#ap{font:inherit;white-space:pre-wrap;max-width:76ch;border:1px solid var(--red);padding:18px;margin:0;box-shadow:0 0 30px rgba(255,77,94,.3)}
#cd{font:700 64px "Chakra Petch",sans-serif;text-shadow:0 0 20px var(--red)}
#rc{border-color:var(--red);color:var(--red);padding:8px 20px}
.alarm .p{border-color:#5a1a24}
.alarm header{color:var(--red)}
@media(prefers-reduced-motion:no-preference){.alarm header{animation:pl 1s infinite}@keyframes pl{50%{opacity:.4}}}
@media(max-width:900px){body{overflow:auto}.app{height:auto}main{grid-template-columns:1fr}#mid{grid-template-rows:380px 360px}#right{min-height:380px}}
body.ov{--ice:#ff9bf5;--line:#4d2060;--panel:#120a1b}
</style>
<style>.l.pl{color:var(--mag)}.jam header{color:var(--red)}.jam #viewp{border-color:#5a1a24}.rev .rd{background:none;color:var(--mag);font-size:0;cursor:default}.rev .rd::after{content:"YOU";font-size:13.5px}</style>

<body>

<!-- cockpit seal (backwards, hex): 4f 48 43 45 -->
<div class="app">
<header><b class="logo">D-COM <small>v4.77</small></b><span id="sess">Session locked</span><span class="sp"></span><span id="clk"></span></header>
<main>
<aside class="p" id="left">
<div class="t">Ship systems</div>

<script>
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
const S={mode:+new URLSearchParams(location.search).get("on")||1,ok:0,temp:543,out:77,jump:0,dead:0,pend:"",tries:0,ov:0,shield:60,thrust:0,cloak:0,course:"",tf:1,scan:0,cap:0,view:"",lt:0,next:"",hist:[],hi:0,drones:{875:"Online",934:"Online",177:"Online",591:"Online",54:"Online"}};
const term=$("#term"),inp=$("#in"),view=$("#view"),cv=$("#cv"),cx=cv.getContext("2d");
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const bar=p=>`<div class="bar"><i style="width:${Math.min(100,Math.max(0,p*100))}%"></i></div>`;
const lock=b=>{inp.disabled=!!b;if(!b)inp.focus()};
const link=(k,s)=>$(`#links [data-k=${k}]`).className=s?"ok":"bad";
async function pr(t,c="",d=12){const e=document.createElement("div");e.className="l "+c;term.append(e);
 if(!d||RM)e.textContent=t;else for(const ch of t){e.textContent+=ch;await sleep(d)}
 term.scrollTop=term.scrollHeight}

const LOGS=[
["4378 C","2023-07-28","16.642577, 65.531059",[["08:00 AM","Jumping to Universe 4378 C..."],["08:10 AM","Scanning International databases..."],["09:14 AM","Detected presence of ‘REDACTED’ (Version 4378-C)."],["09:15 AM","‘REDACTED’ (Version 4378-A) is a Warrior, born and raised in Temoria, identity: nA"],["09:20 AM","Inflection point is found: 1300 years ago"]]],
["7623 A","2023-08-12","37.947859, -53.450664",[["09:00 AM","Jumping to Universe 7623 A..."],["09:10 AM","Scanning International databases...."],["14:37 PM","Discovered ‘REDACTED’ (Version 7623 A)."],["14:37 PM","‘REDACTED’ (Version 7623 A) is an underworld hacker specializing in taking down Cybercriminals. Identity: nA"],["14:48 PM","Notable deviation: Humanity has reached Type-2 systems"]]],
["9125 A","2023-08-17","86.294906, 176.604630",[["10:00 AM","Jumping to Universe 9125 A..."],["10:10 AM","Scanning International databases...."],["10:33 AM","No such name exists: ‘REDACTED’ (Version 9125 A)."],["10:58 AM","Looking for temporal abnormalities under Manual Override"],["16:07 PM","‘REDACTED’ (Version 9125 A) has traveled through time. Destination: nA, Identity: nA"]]],
["0712 B","2023-09-27","54.696540, -26.806521",[["1:30 AM","Jumping to Universe 0712 B..."],["1:40 AM","Scanning International databases...."],["10:45 AM","No such name exists: ‘REDACTED’ (Version 0712 B)."],["12:46 PM","Looking for Rupture Protocols under Manual Override"],["16:07 PM","Rupture protocols exist in 0712 B, ‘REDACTED’ (Version 0712 B) exists, Identity: nA"]]],
["0712 A","2023-09-28","-1.028745, 76.277908",[["18:25 PM","Jumping to Universe 0712 B..."],["18:35 PM","Scanning International databases...."],["22:37 PM","‘REDACTED’ (Version 0712 B) existence confirmed."],["07:21 AM","REDACTED has found and boarded the Ship on Manual Control"],["14:22 PM","REDACTED gives the Captain a fleet of Ships, Identity: nA"]]]];
const MODS=[["Main Ship Controls",0],["SPC Reactor Systems",1],["Log System",1],["Navisys Controls",0],["TempoMod Systems",0],["Drone Controls",1]];
const HELP=[["open <system>","Open a ship system"],["home","Ship overview"],["log <1-5>","Show a universe log"],["scan_area <drone>","Area reconnaissance"],["capture_data <drone>","Ship exterior data"],["override <drone>","Override a drone"],["engage_target <drone> <target>","Engage a target"],["destroy <drone>","Destroy a drone"],["return_home <drone>","Send a drone to base"],["change_temperature <value>","Set reactor temperature"],["adjust_output <value>","Set reactor power output"],["override=\"<key>\"","Council override: unlock all systems"],["shields / thrust <0-100>","Main ship controls"],["cloak <on|off>","Toggle cloak"],["plot <universe>","Navisys: plot a course"],["dilate <0.1-10>","TempoMod: time dilation"],["clear / exit","Clear console / end session"]];

const VIEWS={
home:()=>`<div class="home"><h1>Crystal Ship 065</h1><p>Remote link stable. ${S.ov?6:3} of 6 systems answer to this terminal. Pick a system on the left, or type <code>help</code> in the console.</p></div>`,
reactor:()=>`<div class="kv"><div><small>Reactor temperature</small><b class="big ${S.temp>700?"hot":""}">${S.temp}°C</b>${bar(S.temp/1000)}</div><div><small>Power output</small><b class="big">${S.out}%</b>${bar(S.out/100)}</div></div>
<dl><dt>Fission material</dt><dd>UR-Ciliax-145</dd><dt>Recharge in</dt><dd>12 years, 5 months, 14 days</dd></dl>
<p class="warn">Unauthorized access may lead to catastrophic consequences.</p>
<div class="ctl"><label>Temperature <input id="rt" type="number" value="${S.temp}"></label><button onclick="run('change_temperature '+$('#rt').value)">Set</button><label>Output <input id="ro" type="number" value="${S.out}"></label><button onclick="run('adjust_output '+$('#ro').value)">Set</button></div>`,
drones:()=>`<div class="dg">${Object.entries(S.drones).map(([n,s])=>{const id=String(n).padStart(3,"0");return `<div class="dc ${s=="Destroyed"?"x":""}"><b>DRN-${id}</b><em>${s}</em><div>${["scan_area","capture_data","override","return_home","destroy"].map(c=>`<button data-c="${c} ${id}">${c.split("_")[0]}</button>`).join("")}</div></div>`}).join("")}</div>`,
main:()=>`<div class="kv"><div><small>Shields</small><b class="big">${S.shield}%</b>${bar(S.shield/100)}</div><div><small>Thrust</small><b class="big">${S.thrust}%</b>${bar(S.thrust/100)}</div></div><dl><dt>Cloak</dt><dd>${S.cloak?"ENGAGED":"Off"}</dd><dt>Hull</dt><dd>95%</dd></dl><div class="ctl"><button data-c="cloak ${S.cloak?"off":"on"}">Toggle cloak</button><button data-c="shields 100">Shields max</button><button data-c="thrust 0">All stop</button></div>`,
nav:()=>`<p>Position: Otherworld 0712-B · Course: <code>${S.course||"none"}</code></p><div class="chips">${LOGS.map(l=>`<button data-c="plot ${l[0].replace(" ","")}" class="${S.course==l[0]?"on":""}">${l[0]}</button>`).join("")}</div><dl>${LOGS.map(l=>`<dt>${l[0]}</dt><dd>${l[2]}</dd>`).join("")}</dl>`,
tempo:()=>`<small>Chronal field</small><b class="big ${S.tf>2?"hot":""}">${S.tf}×</b>${bar(tc()/100)}<dl><dt>Capacity</dt><dd>${tc()}%</dd><dt>Inflection point</dt><dd>1300 years ago</dd></dl><div class="chips">${[.5,1,2,5,10].map(x=>`<button data-c="dilate ${x}" class="${S.tf==x?"on":""}">${x}×</button>`).join("")}</div>`,
logs:()=>`<div class="chips">${LOGS.map((l,i)=>`<button data-c="log ${i+1}">${l[0]}</button>`).join("")}</div><div id="lg"></div>`};
const TITLES={home:"Crystal Ship 065",reactor:"SPC reactor systems",drones:"Drone controls",logs:"Log of the Crystal Ship 065",main:"Main ship controls",nav:"Navisys controls",tempo:"TempoMod systems"};
function setView(n){S.view=n;$("#vt").textContent=TITLES[n];cv.style.opacity=n=="home"?1:.1;view.innerHTML=VIEWS[n]();if(n=="logs")showLog(0)}
const refresh=()=>{if(S.view=="drones")setView("drones")};
async function showLog(i){const l=LOGS[i],tok=++S.lt;document.querySelectorAll(".chips button").forEach((b,j)=>b.classList.toggle("on",i==j));
 const g=$("#lg");g.innerHTML=`<div class="lh"><b>Universe ${l[0]}</b><span>${l[1]}</span><span>${l[2]}</span></div>`;
 for(const [t,m] of l[3]){if(tok!=S.lt)return;g.insertAdjacentHTML("beforeend",`<div class="le"><time>${t}</time>${esc(m).replace(/REDACTED/g,'<span class="rd" title="Clearance required">REDACTED</span>')}</div>`);await sleep(RM?0:700)}
 if(tok==S.lt)g.insertAdjacentHTML("beforeend",'<div class="le end">End of log</div>')}
function tele(){$("#tl").innerHTML=[["Reactor temperature",S.temp+"°C",S.temp/1000,S.temp>700],["Power output",S.out+"%",S.out/100],["TempoMod capacity",tc()+"%",tc()/100],["Hull integrity","95%",.95]].map(r=>`<div class="tr ${r[3]?"hot":""}"><span>${r[0]}</span><b>${r[1]}</b>${bar(r[2])}</div>`).join("")+'<div class="tr"><span>Radiation</span><b>Background</b></div>'}

let vt=Date.now(),l0=vt;
const tc=()=>Math.round(83-Math.abs(Math.log10(S.tf))*20);
const clk=()=>{const n=Date.now();vt+=(n-l0)*S.tf;l0=n;return new Date(vt).toLocaleTimeString("en-GB",{timeZone:"Europe/Berlin"})+" CEST"+(S.tf!=1?" \u00d7"+S.tf:"")};
const mods=()=>$("#mods").innerHTML=MODS.map(m=>`<button class="mod ${m[1]||S.ov?"":"no"}" data-c="open ${m[0].toLowerCase()}"><span>${m[0]}</span><em>${m[1]?"Available":S.ov?"Unlocked":"Denied"}</em></button>`).join("");
async function ovr(k){if(S.ov)return pr(">> Council override already active.","warn");
 if(k.toLowerCase()!="xl554-mrak-jm")return pr(">> Override signature rejected. Attempt logged.","err");
 document.body.classList.add("ov");await pr(">> Decrypting council key XL554...","c");
 for(let i=0;i<5;i++){await pr("   "+Array.from({length:36},()=>"0123456789ABCDEF"[Math.random()*16|0]).join(""),"u",0);await sleep(250)}
 await pr(">> Mirakilin Council seal verified. Operator: MRAK-JM","ok");
 for(const m of MODS)if(!m[1]){await sleep(550);await pr(`>> ${m[0]}: DENIED -> UNLOCKED`,"ok")}
 await sleep(550);await pr(">> Drone override + targeting: DENIED -> UNLOCKED","ok");
 S.ov=1;mods();tele();$("#sess").textContent="Session active \u00b7 COUNCIL OVERRIDE";setView("home");
 await pr(">> ALL SYSTEMS UNLOCKED. Type help for the new commands.","warn")}
async function ovcmd(C,a){if(!S.ov)return pr(">> ACCESS DENIED: requires RUPTURE clearance.","err");
 const x=a.join(""),n=parseFloat(x);
 if(C=="cloak"){if(!/^(on|off)$/i.test(x))return pr("> Usage: cloak <on|off>","err");S.cloak=+(x.toLowerCase()=="on");await pr(S.cloak?">> Cloak engaged. Signature masked.":">> Cloak disengaged.","ok")}
 else if(C=="plot"){const u=LOGS.find(l=>l[0].replace(" ","").toLowerCase()==x.replace(/[ -]/g,"").toLowerCase());
  if(!u)return pr("> Usage: plot <universe>   e.g. plot 4378C","err");S.course=u[0];
  await pr(`>> Plotting course to Universe ${u[0]} @ ${u[2]}...`,"ok");await sleep(800);await pr(">> Course locked. Jump requires TempoMod phase alignment.","c")}
 else{if(isNaN(n))return pr(`> Usage: ${C} <value>`,"err");
  if(C=="dilate"){if(n<.1||n>10)return pr(">> Dilation range: 0.1 to 10.","err");S.tf=n;await pr(`>> Chronal field set to ${n}x. Local time now flows ${n}x.`,"ok")}
  else{const k=C=="shields"?"shield":"thrust";S[k]=Math.min(100,Math.max(0,n));await pr(`>> ${C} set to ${S[k]}%.`,"ok")}}
 tele();if(["main","nav","tempo"].includes(S.view))setView(S.view)}
async function dov(C,n,dn,a){
 if(C=="override"){S.drones[n]="Override";await pr(`>> ${dn}: manual control engaged. Council signature accepted.`,"ok");return refresh()}
 if(S.drones[n]!="Override")return pr(`>> ${dn}: override required first. Run: override ${String(n).padStart(3,"0")}`,"err");
 const t=a.slice(1).join(" ");if(!t)return pr("> Usage: engage_target <drone> <target>","err");
 await pr(`>> ${dn}: acquiring ${t}...`,"ok");await sleep(900);await pr(">> Lock achieved. Firing.","warn");await sleep(900);await pr(`>> ${t}: target neutralised.`,"ok")}

async function exec(v){
 const [c,...a]=v.split(/\s+/),C=c.toLowerCase(),A=a.join(" ").toLowerCase();
 if(S.pend=="auth"){if(v=="0000"){S.pend="";return enter()}
  if(++S.tries>=3){S.dead=1;await pr(">> ERROR! Access locked. Session terminated.","err");return end("ACCESS LOCKED\nThree invalid codes. Session terminated.","Restart","")}
  return pr(`>> ERROR! Invalid code (${S.tries}/3).`,"err")}
 if(S.pend=="temp"||S.pend=="out"){const k=S.pend;S.pend="";return setR(k,v)}
 const om=v.match(/^override\s*=\s*["“]?([\w-]+)["”]?$/i);if(om)return S.ok?ovr(om[1]):pr(">> Not authorized.","err");
 if(C=="help"){for(const [x,d] of HELP)await pr("  "+x.padEnd(32)+d,"",0);return}
 if(!S.ok){if(S.mode==3&&C=="transmit_inquiry")return inquiry();
  if(S.mode==3&&C=="return_home"){location.search="";return}
  return pr(">> Not authorized.","err")}
 switch(C){

 else if(e.key=="ArrowDown"){S.hi=Math.min(S.hist.length,S.hi+1);inp.value=S.hist[S.hi]||""}});
document.addEventListener("click",e=>{const b=e.target.closest("[data-c]");if(b&&S.ok&&!inp.disabled)run(b.dataset.c)});

let ang=0;
function fit(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;cx.setTransform(d,0,0,d,0,0)}
function draw(){const r=cv.getBoundingClientRect(),w=r.width,h=r.height,sc=Math.min(w,h)/4.2;cx.clearRect(0,0,w,h);
 const col=S.jump?"#ff4d5e":S.ov?"#ff9bf5":"#7de9ff";cx.strokeStyle=col;cx.shadowColor=col;cx.shadowBlur=12;cx.lineWidth=1.3;
 [[1,ang],[.5,-ang*1.7]].forEach(([k,a],j)=>{cx.globalAlpha=j?.5:.9;
  const P=V.map(([x,y,z])=>{x*=k;y*=k;z*=k;const c=Math.cos(a),s=Math.sin(a),X=x*c+z*s,Z=-x*s+z*c,t=.35,Y=y*Math.cos(t)-Z*Math.sin(t),Z2=y*Math.sin(t)+Z*Math.cos(t),f=1/(1-Z2*.12);
   return [w*.72+X*sc*f+(S.jump?(Math.random()-.5)*6:0),h/2+Y*sc*f]});
  cx.beginPath();E.forEach(([i,m])=>{cx.moveTo(...P[i]);cx.lineTo(...P[m])});cx.stroke()});
 ang+=RM?0:.008;requestAnimationFrame(draw)}
new ResizeObserver(fit).observe(cv);fit();draw();

    HELP.push(["chapter2","Show Chapter Two objective and progression"],["compare_logs <0712-A> <0712-B>","Compare the contradictory 0712 records"],["reconstruct <receipt-time> <source-time>","Reconstruct the circular route from packet times"]);
    await pr("===== CHAPTER TWO // THE VOICE IN THE BLACK BOX =====","warn",0);
    await say("ch2intro","I found the coordinates. They're not coordinates to another universe. They're coordinates to a place the Council removed from every map. I checked the records three times. The destination is listed as nonexistent. But there's a transmission coming from there. It's using my voice. And it says you've already arrived. — P");
    await pr(">> New artifact indexed: artifact route","c",0);
    await pr(">> Objective: examine the null route, compare the 0712 records, and reconstruct the event order.","c",0);
  };
  const chapter2Status=()=>pr([
    "D-COM // CHAPTER TWO: THE VOICE IN THE BLACK BOX",
    `STATUS: ${!G.ch2.started?"LOCKED":G.ch2.complete?"COMPLETE":G.ch2.reconstructed?"FINAL RECORDS AVAILABLE":"INVESTIGATION ACTIVE"}`,
    `NULL ROUTE READ: ${G.ch2.read.null_route?"YES":"NO"}`,
    `VOICEPRINT READ: ${G.ch2.read.voiceprint_0712?"YES":"NO"}`,
    `0712 RECORDS COMPARED: ${G.ch2.compared?"YES":"NO"}`,
    `CAUSAL ROUTE RECONSTRUCTED: ${G.ch2.reconstructed?"YES":"NO"}`,
    `COUNCIL ADDENDUM READ: ${G.ch2.read.council_addendum_0712_null?"YES":"NO"}`,
    `CHAPTER TWO COMPLETE: ${G.ch2.complete?"YES":"NO"}`,
    "",
    G.ch2.complete?"NEXT LEAD: the missing cockpit recording":"Current lead: use evidence, artifact route, and the commands revealed by the artifacts."
  ].join("\n"),"c",0);

  HELP.push(["artifact <name>","Read an unlocked in-world artifact"],["evidence","Show clue and artifact progression"],["status","Show ship and ARG state"],["comms","Replay pilot transmissions"],["trace [origin]","Show trace or investigate its origin"],["debug_rupture","Run temporal and carrier diagnostics"],["verify <token>","Check a recovered verification token"],["reset_arg","Reset local ARG progress (dev=1 only)"]);
  if(G.ch2.started)HELP.push(["chapter2","Show Chapter Two objective and progression"],["compare_logs <0712-A> <0712-B>","Compare the contradictory 0712 records"],["reconstruct <receipt-time> <source-time>","Reconstruct the circular route from packet times"]);
  if(DEV)HELP.push(["test_trace100","DEV ONLY: force trace to 100% and trigger the jammer"],["test_chapter2","DEV ONLY: start Chapter Two for testing"]);

  const baseTele=tele;
  tele=function(){
    baseTele();
    if(!S.ok)return;
    const el=document.createElement("div");el.className=`tr ${G.tr>70?"hot":""}`;
    el.innerHTML=`<span>Trace exposure</span><b>${Math.round(G.tr)}%</b>${bar(G.tr/100)}`;
    $("#tl").appendChild(el);
  };

  function bump(n){
    if(G.jam||G.clr||!S.ok)return;
    const before=G.tr;
    G.tr=Math.min(100,G.tr+(S.cloak?Math.ceil(n/2):n));
    if(before<25&&G.tr>=25)void say("trace25","I'm seeing echoes of the commands you're sending. That shouldn't be possible. Keep your transmissions short.");
    if(before<55&&G.tr>=55)void say("trace55","The Rupture buffer just answered a packet I haven't sent yet. Don't call that a delay. The reply arrived first.");
    if(before<80&&G.tr>=80)void say("trace80","Carrier 7623.A is back. It wasn't in the routing table a minute ago. Something is learning the route from your side.");
    tele();save();
    if(G.tr>=100)void startJam();
  }

  async function startJam(){
    if(G.jam||G.clr)return;
    G.jam=1;G.phase="jam";G.tr=100;G.j={};save();document.body.classList.add("jam");link("rup",0);tele();
    await pr(">> ALERT: hostile carrier riding the RUPTURE address. Link degraded.","err");
    await say("j1","They found me. Someone has been following your signal back to this ship, so I'm cutting the Rupture line. If you can still read this, start with the carrier in the traffic feed. The 7623-A log mentions a hacker who lived in the dark. Find the frequency. Don't trust the timestamps.");
  }

  async function clearJam(){
    G.jam=0;G.clr=Date.now();G.clearedSession=G.v;G.postClearReady=0;G.phase="quiet";G.tr=20;moodDelta(2);save();document.body.classList.remove("jam");link("rup",1);tele();
    await pr(">> Jam bypassed. Rupture line restored.","ok");
    await say("j4","...The line is back. I need you to hear this clearly: the jam was not tuned to keep the Council out. It was tuned to a signature. Yours. I need another session to compare it with the archive without lighting the signal again.");
    await pr(">> Post-jam archive investigation queued. Reconnect in a new session to continue.","warn",0);
  }

  async function reveal(){
    await pr(">> Back-tracing hostile carrier through the archived universe hops...","ok");await sleep(550);
    for(const u of ["4378 C","7623 A","9125 A","0712 B","0712 A"]){await pr("   archive hop: Universe "+u,"u",0);await sleep(250)}
    await pr(">> Origin universe: NOT REPRESENTED IN NAVISYS","warn");await sleep(350);
    await pr(">> Fictional terminal signature: "+G.signature,"warn");
    await pr(">> Identity pattern: MATCH FOUND","warn");await sleep(550);
    await pr(">> SUBJECT: REDACTED (VERSION "+G.signature+")","err",24);await sleep(650);
    G.rev=1;G.phase="identity";G.postClearReady=1;G.revealSession=G.v;G.trust=Math.max(G.trust,1);save();document.body.classList.add("rev");
    await say("f1","Every REDACTED in every log was a version of you. Not the same biography. Not the same choices. The same pattern underneath. I was looking for one person, and the Council made five lives look unrelated.");
    await say("f2","The Council did not erase you from the record. It erased the part that made the records line up. I have one route left, but I won't transmit it until we know whether MRAK-JM was trying to save the subject or preserve the containment. Read the correction and Council fragment. Then keep this terminal. — P.");
    await pr(">> New artifacts available: artifact council, artifact correction, artifact pilot","c",0);
  }

  const oldExec=exec;
  exec=async function(v){
    const raw=String(v||"").trim();if(!raw)return;
    const [c,...a]=raw.split(/\s+/),C=c.toLowerCase(),A=a.join(" ").toLowerCase();
    if(C==="reset_arg"&&DEV){try{localStorage.removeItem(K)}catch(e){};location.reload();return}
    if(C==="test_chapter2"){
      if(!DEV)return pr(">> TEST COMMAND DISABLED. Append ?dev=1 to the URL to enable developer tools.","err",0);
      if(!S.ok||S.pend==="auth")return pr(">> Authenticate first, then run test_chapter2.","err",0);
      G.rev=1;G.clr=G.clr||Date.now();G.revealSession=G.v-1;G.signature=G.signature||`0712-${randHex(4)}-${randHex(4)}`;save();
      await startChapter2();return;
    }
    // Developer-only test hook. It is not registered as a working command outside ?dev=1.
    if(C==="test_trace100"){
      if(!DEV)return pr(">> TEST COMMAND DISABLED. Append ?dev=1 to the URL to enable developer tools.","err",0);
      if(!S.ok||S.pend==="auth")return pr(">> Authenticate first, then run test_trace100.","err",0);
      if(G.jam)return pr(">> TEST: trace is already at the jammer stage.","warn",0);
      if(G.clr)return pr(">> TEST: this run already cleared the jammer. Run reset_arg to start a clean test.","err",0);
      G.tr=100;G.phase="test-trace100";save();tele();
      await pr(">> DEV TEST: trace exposure forced to 100%.","warn",0);
      await startJam();
      return;
    }
    if(S.pend==="auth"&&C==="artifact"&&(A==="boot_sector"||A==="boot"||A==="service"))return printArtifact("boot_sector");
    if(S.pend==="auth"&&C==="help")return pr("Commands available before login: artifact boot_sector. The service snapshot records the local factory PIN.","c",0);
    if(!S.ok||S.pend==="auth")return oldExec(raw);
    if(S.pend==="temp"||S.pend==="out"){
      const pending=S.pend;
      await oldExec(raw);saveShip();
      if(!Number.isNaN(parseFloat(raw)))await react(pending==="temp"?"change_temperature":"adjust_output",[raw],raw.toLowerCase(),false,S.ov);
      return;
    }

    if(C==="chapter2"){
      if(!G.ch2.started)return pr(">> Chapter Two is not yet indexed. Complete the identity investigation and reconnect.","err",0);
      return chapter2Status();
    }
    if(C==="compare_logs"){
      if(!G.ch2.started)return pr(">> No Chapter Two archive session is active.","err",0);
      if(!G.ch2.read.null_route||!G.ch2.read.voiceprint_0712)return pr(">> Comparison incomplete. Read artifact route, then artifact voiceprint.","err",0);
      const norm=a.map(x=>x.toUpperCase().replace(/[^A-Z0-9]/g,""));
      if(norm.join("|")!=="0712A|0712B")return pr(">> Record pair rejected. Compare the A and B records in that order; do not merge their claims.","err",0);
      if(!G.ch2.compared){G.ch2.compared=1;G.phase="chapter2-comparison";moodDelta(1);save();}
      await pr(">> COMPARISON ACCEPTED: 0712-A and 0712-B cannot share a single wall-clock chronology.","ok",0);
      await pr(">> ENTRY EVENT 07:21 precedes the recorded jump at 18:25, yet the voiceprint claims both records belong to the same ship session.","warn",0);
      await pr(">> New artifact indexed: artifact blackbox","c",0);
      await say("ch2compare","Those records aren't merely mislabelled. The same voice exists on both sides of the event. Read the black box buffer and follow its packet-order rule. Don't sort by the ship's clock.");
      return;
    }
    if(C==="reconstruct"){
      if(!G.ch2.compared)return pr(">> Reconstruction unavailable. First read the route and voiceprint, then compare_logs 0712-A 0712-B.","err",0);
      const times=a.map(x=>x.replace(/\D/g,""));
      if(times.join("|")!=="0721|1825")return pr(">> Causal order rejected. Use the receipt time first, then the source time, with four digits for each. The clock labels are not the same as packet order.","err",0);
      if(!G.ch2.reconstructed){G.ch2.reconstructed=1;G.phase="chapter2-reconstructed";moodDelta(1);save();}
      await pr(">> CAUSAL ROUTE RECONSTRUCTED: 0712-NULL","ok",0);
      await pr(">> NAVISYS destination resolved: LOCAL ARCHIVE LOOP / CRYSTAL SHIP 065","warn",0);
      await pr(">> The route was never pointing outside the ship. It points to a record written before its own arrival event.","c",0);
      await pr(">> New artifact indexed: artifact council_addendum","c",0);
      await say("ch2route","That voiceprint is mine. I checked it against the cockpit recorder. I don't remember sending the outbound message, but I remember the hatch opening at 07:21. I remember being alone. Those memories don't fit in one order. Read the Council addendum. It may tell us who decided I should forget.");
      return;
    }
    if(C==="artifact")return printArtifact(a[0]);
    if(C==="evidence")return evidence();
    if(C==="status")return status();
    if(C==="comms"){
      if(!G.log.length)return pr(">> No transmissions received.","u");
      for(const t of G.log)await pr("PILOT> "+t,"pl",0);
      return;
    }
    if(C==="trace"){
      if(A!=="origin")return pr(">> Trace exposure: "+Math.round(G.tr)+"%"+(G.jam?" (JAMMED)":""),G.tr>70?"warn":"c");
      if(!G.clr)return pr(">> Origin trace unavailable: no hostile carrier captured.","err");
      if(G.rev)return pr(">> Origin already resolved: you. The individual biographies still differ.","warn");
      if(!DEV&&G.v<=(Number(G.clearedSession)||0))return pr(">> Origin trace not ready. End this session and reconnect; P needs a clean archive comparison.","err");
      return reveal();
    }
    if(C==="debug_rupture"){
      G.verified777=1;G.phase=G.jam?"jam-diagnostic":G.phase;save();
      await pr(">> Running Rupture Diagnostic Subroutine...","c");await sleep(300);
      await pr(">> ERROR AT MEMORY ADDRESS 0x0712-B","err",0);
      await pr(">> INTRUDER SIGNATURE DETECTED: VURG-0","warn",0);
      await pr(">> DECRYPTION HASH GENERATED: 0x777-MRAK-SECURE","ok",0);
      await pr(">> The diagnostic is a local simulation. No external system was contacted.","u",0);
      await say("diag","VURG-0. I know that string. It was written in a report the Council later marked nonexistent. Don't assume a diagnostic is telling you who wrote it.");
      return;
    }
    if(C==="verify"){
      if(a.join("").toUpperCase()!=="777-MRAK-SECURE")return pr(">> Verification token rejected.","err");
      G.verified777=1;save();moodDelta(1);
      await pr(">> TOKEN ACCEPTED: 777-MRAK-SECURE","ok",0);
      await pr(">> Council seal family: XL554 // operator record: MRAK-JM","warn",0);
      return say("verify777","That token belongs to the old seal family. It proves the record was touched by a Council-authorised process. It does not prove MRAK-JM agreed with it.");
    }
    if(C==="tune"){
      if(!G.jam)return pr(">> No carrier to tune.","err");
      if(a.join("").replace(/\D/g,"")!=="7623")return pr(">> Carrier drift. Off frequency. Cross-reference the carrier suffix with the universe logs.","err");
      G.j.t=1;G.phase="carrier-mapped";save();moodDelta(1);
      await pr(">> Carrier locked at 7623. Jam layer 1 of 3 mapped.","ok");
      await say("j2","Good. It isn't coming from a ship close by. The packet goes through five relay IDs, and they acknowledge it before the sender transmits. I left the hop order in the dead drop: artifact dead_drop. Six chairs, six steps. Try to recover the word before the numbers.");
      return;
    }
    if(C==="relay"){
      if(!G.jam||!G.j.t)return pr(">> Relay refused. Map the carrier first.","err");
      if(a.map(x=>parseInt(x,10)).join()!=="177,54,591,934,875")return pr(">> Hop order rejected. The dead drop contains both a word and a relay chain. Check the six-step instruction; the chain may be reconstructed from the captured acknowledgements.","err");
      G.j.r=1;G.phase="relay-mapped";save();moodDelta(1);
      await pr(">> Relay chain accepted. Jam layer 2 of 3 mapped.","ok");
      await say("j3","The packets are arriving before they're sent. That's not a normal relay delay. The capture is now stored as artifact intercept. One layer left: I hid a fallback in the skin of this terminal. Inspect the HTML source, find the carrier fallback, decode it, and enter decode <word>.");
      return;
    }
    if(C==="decode"){
      if(!G.jam||!G.j.r)return pr(">> Nothing to decode yet.","err");
      if(a.join("").toLowerCase()!=="mirror")return pr(">> Passphrase rejected. Look for the carrier fallback comment in the HTML source; it is encoded, not encrypted.","err");
      return clearJam();
    }
    if(G.jam&&!( ["help","clear","exit","comms","trace","tune","relay","decode","log","home","artifact","evidence","status","debug_rupture","verify"].includes(C)||(C==="open"&&A.includes("log")))){
      return pr(">> "+raw.replace(/[a-z]/gi,ch=>Math.random()<.5?"▒░#%&"[Math.random()*5|0]:ch)+" : LINK JAMMED, packet lost","err",0);
    }
    const ovb=S.ov,om=/^override\s*=/i.test(raw);
    const droneId=["destroy","scan_area","capture_data","return_home","override","engage_target"].includes(C)?String(parseInt(a[0],10)):null;
    const preDrone=droneId!==null?S.drones[droneId]:undefined;
    await oldExec(raw);
    saveShip();
    await react(C,a,A,om,ovb,preDrone);
  };

  async function react(C,a,A,om,ovb,preDrone){
    const n=parseFloat(a[0]);
    if(om){
      if(S.ov&&!ovb){bump(10);moodDelta(-1);return say("ov","That seal. I haven't seen XL554 since Temoria. Whoever you are, you are not here by accident.")}
      if(!S.ov){bump(12);moodDelta(-1);return say("bad","Someone just tried Council keys on my terminal and failed. The Council claims the old keys were destroyed. Someone is lying.")}
      return;
    }
    switch(C){
      case "destroy": {
        const did=String(parseInt(a[0],10));
        if(!(did in S.drones)||preDrone===undefined||preDrone==="Destroyed")return;
        G.actions.destroy=(G.actions.destroy||0)+1;saveShip();moodDelta(-2);bump(8);
        if(did==="177")return say("d177","DRN-177 went dark. That one watched the route behind us. I can't tell whether you made us safer or blind.");
        return say("d","That was one of my eyes outside. The hull is a little blinder each time.");
      }
      case "scan_area":case "capture_data": {
        const did=String(parseInt(a[0],10));
        if(!(did in S.drones)||preDrone===undefined||preDrone==="Destroyed")return;
        G.actions.scans=(G.actions.scans||0)+1;bump(4);
        if(G.actions.scans>=3){moodDelta(-1);return say("manyScans","You've pinged the perimeter three times. The replies aren't echoing from space anymore. They're coming from the archive.")}
        return say("s","Every drone ping is a door someone can walk through. Use them carefully.");
      }
      case "override":
        if(!S.ov||preDrone!=="Online")return;
        bump(6);moodDelta(-1);return say("droneOverride","Manual control accepted. I didn't authorise that drone override. If you found a way around the Council lock, tell me what else you can see.");
      case "engage_target":
        if(S.ov&&preDrone==="Override"&&a.length>=2){bump(15);moodDelta(-2);return say("e","You just fired from my ship. I did not aim that. The target's transponder was a Council archive index.")}
        return;
      case "cloak":
        if(!S.ov)return;
        if(A==="on"){moodDelta(1);return say("c1","Cloak up. Quieter. It won't make us invisible, but it makes the carrier work harder to keep a lock.")}
        return say("c0","Cloak down. The carrier will have an easier time matching the signature now.");
      case "dilate":
        if(n&&n!==1){bump(3);return say("t","Time is bending around us. The log clocks are drifting, but the packet acknowledgements disagree too. Don't trust timestamps alone.")}
        return;
      case "thrust":
        if(n>50){bump(5);return say("th","That thrust leaves a wake across universes. I can see it in the traffic feed even after the engines stop.")}
        return;
      case "shields":
        if(n<30){bump(5);moodDelta(-1);return say("sh","Shields below thirty. Are you trying to get me killed, or are you testing what the hunter can hit?")}
        return;
      case "change_temperature":
        if(n===777){bump(6);G.verified777=1;save();return say("sync777","Special sync. 777-MRAK-SECURE. That isn't a reactor password in the ordinary sense. It was embedded in an old Council verification chain.")}
        if(n>900){bump(15);moodDelta(-2);return say("h2","Containment margin! Back it off now! Unless you're trying to make the ship visible to every listener in the branch.")}
        if(n>700){bump(10);moodDelta(-1);return say("h1","The reactor is spiking. We cannot hide that heat signature. Lower it before the carrier locks again.")}
        if(n>0&&n<=600){moodDelta(1);return say("cool","That is within the quiet range. You checked before pushing it. I appreciate that.")}
        return;
      case "adjust_output":
        if(n>95){bump(7);return say("powerHigh","Power output that high leaves a harmonic in the Rupture channel. That's what the old diagnostic called a continuity echo.")}
        if(n>=0&&n<=80){moodDelta(1);return say("powerLow","Lower output. Less noise on the line. Good call.")}
        return;
      case "plot":{
        if(!S.ov)return;
        const key=A.replace(/[ -]/g,"");
        const target=LOGS.find(l=>l[0].replace(" ","").toLowerCase()===key);
        if(target){
          if(target[0]==="9125 A")return say("p9125","9125-A is missing from one index but present in the ship's jump history. Someone removed the destination, not the journey.");
          if(target[0]==="0712 A"||target[0]==="0712 B")return say("p0712","I remember that universe differently from what the log says. The label changed after arrival. Check the correction when the archive reopens.");
          return say("p","I remember that universe differently from what the log says. Someone has been editing the records after the jump.");
        }return;
      }
      case "log":
        if(+A===5)return say("l5","Log 5 is wrong. The header says 0712 A, the first line says 0712 B, and the clock runs backwards. Don't 'fix' it yet. The contradiction is evidence.");
        if(+A===3)return say("l3","9125-A says the person doesn't exist, then immediately records their time displacement. Absence and evidence are in the same entry.");
        return;
    }
  }

  const oldEnter=enter;
  enter=async function(){
    await oldEnter();
    if(S.ov)mods();
    if(G.v>1){const d=Math.floor((Date.now()-prev)/DAY);await say("v"+G.v,d>=1?"You're back. "+d+" day"+(d>1?"s":"")+" since your last session. The Rupture line remembers the shape of the connection.":"Same terminal, same signature. You're back.")}
    if(G.jam){G.phase=G.j.r?"relay-mapped":G.j.t?"carrier-mapped":"jam";document.body.classList.add("jam");link("rup",0);await pr(">> Rupture line still jammed. Type comms to reread the pilot; use evidence to check progress.","err")}
    else if(G.clr&&!G.rev){
      if(DEV||G.v>(Number(G.clearedSession)||0)){
        G.postClearReady=1;G.phase="post-jam";save();
        await say("p2","I ran the jam signature against the ship logs. I'd rather not believe the result. The archive correction and the six-seat fragment are available now. Read both, compare them with Log 5, then type: trace origin.");
      }else await pr(">> Pilot offline. Line quiet. Archive comparison pending next session.","u");
    }
    if(G.rev)document.body.classList.add("rev");
    if(G.rev&&!G.ch2.started&&G.v>Number(G.revealSession||0))await startChapter2();
    else if(G.ch2.started&&!G.ch2.complete&&G.v>Number(G.ch2.introSession||G.v)&&!G.ch2.returnTransmission){
      G.ch2.returnTransmission=1;save();
      await say("ch2return","I found a second copy of the route stub in the local archive. It was stored before the first one was created. That shouldn't be possible. The terminal can show you the copy: artifact route. — P");
    }
    tele();saveShip();
  };

  const oldDrone=drone;
  drone=async function(C,a){await oldDrone(C,a);saveShip()};

  // Keep the rising carrier visible in the traffic feed after detection.
  setInterval(()=>{if(G.jam&&!document.hidden){const f=$("#feed");f.insertAdjacentHTML("beforeend",`<div style="color:#ff4d5e">CARR 7623.A LOCK ${randHex(4)}</div>`);while(f.children.length>24)f.firstElementChild?.remove()}},1700);
  setInterval(()=>{if(S.ok&&!G.jam&&!G.clr&&G.tr>0){G.tr=Math.max(0,G.tr-(S.cloak?2:1));tele();save()}},10000);
  setInterval(()=>{if(S.ok&&S.ov&&!G.jam&&!G.clr)bump(1)},15000);
  if(G.jam){document.body.classList.add("jam");link("rup",0)}
})();
</script>
<script>
(()=>{
const K3="dcom_arg_ch3",DEV=/[?&]dev=1/.test(location.search);
let C={loads:0,seen:0,started:0,a:0,b:0,sec:0,done:0,end:"",gain:50,filt:1000,ch:1,t:"0000",bc:0};
try{C={...C,...JSON.parse(localStorage.getItem(K3)||"{}")}}catch(e){}
C.loads++;
const sv=()=>{try{localStorage.setItem(K3,JSON.stringify(C))}catch(e){}};sv();
const g2=()=>{try{return JSON.parse(localStorage.getItem("dcom_arg_v1")||"{}")}catch(e){return{}}};
const ch2=()=>!!(g2().ch2&&g2().ch2.complete),sig=()=>g2().signature||"0712-0000-0000";
const P=t=>pr("PILOT> "+t,"pl",14),L=(t,c="c")=>pr(t,c,0);
const cs=s=>String([...s].reduce((n,c)=>n+c.charCodeAt(0),0)%97).padStart(2,"0");
const code=()=>{const b=`EC3-${sig()}-${C.end}`;return b+"-"+cs(b)};
TITLES.rec="Cockpit recorder";
VIEWS.rec=()=>`<div class="kv"><div><small>Gain</small><b class="big">${C.gain}</b>${bar(C.gain/100)}</div><div><small>Filter</small><b class="big">${C.filt} Hz</b></div></div><dl><dt>Position</dt><dd>${C.t}</dd><dt>Seal</dt><dd>${C.sec?"BROKEN":"XL554 sealed"}</dd><dt>Outbound 18:25</dt><dd>${C.done?"SENT":"empty slot"}</dd></dl><div class="chips">${[1,2,3,4,5].map(n=>`<button data-c="channel ${n}" class="${C.ch==n?"on":""}">CH${n}</button>`).join("")}</div><div class="chips">${["0000","0721","1825"].map(t=>`<button data-c="scrub ${t}">${t}</button>`).join("")}</div>`;
const v3=()=>{if(S.view=="rec")setView("rec")};

const TOP={

 if(k=="scrub"){const t=A.replace(/\D/g,"");if(t.length!=4||+t.slice(0,2)>23||+t.slice(2)>59)return L("> Usage: scrub <hhmm>, e.g. scrub 0721","err");C.t=t;

  else if(t=="1825")await L(">> 18:25 // CH3 outbound slot: P's voice. \"If you are hearing this, do not follow my coordinates.\" The cadence is wrong. P speaks in whole breaths. This was typed, then voiced.","warn");
  else await L(">> "+t.slice(0,2)+":"+t.slice(2)+" // static. The tape only holds events at times the logs disagree about.","u");

  await L([">> CH1: cockpit ambient. Wind that shouldn't exist in a sealed hull.",">> CH2: hatch and airlock. Hinges, then silence.",">> CH3: comms. The outbound slot at 18:25 is on this channel.",`>> CH4: reactor hum, tuned to ${S.temp}°C. The tape knows what you set.`,">> CH5: unlabeled."][n-1],"ok");v3();return chk()}
 if(k=="gain"){if(!(n>=0&&n<=100))return L("> Usage: gain <0-100>","err");C.gain=n;sv();await L(">> Gain set to "+n+(n>95?". Clipping.":"."),n>95?"warn":"ok");v3();return chk()}

 if(k=="unseal"){if(!C.b)return L(">> Nothing to unseal. Hear CH5 first.","err");if(C.sec)return L(">> Seal already broken.","warn");

  return P("The 18:25 outbound slot is empty and waiting for a sender. The only operator on this line is you. I won't write it for you: transmit warn, transmit guide, or transmit silence. Whatever you choose, the tape will always have said it. — P")}
 if(k=="transmit"){if(!C.sec)return L(">> Outbound slot sealed.","err");if(C.done)return L(">> The loop has closed. Type export to share your code.","warn");
  const e=E[a1];if(!e)return L("> Usage: transmit <warn|guide|silence>","err");

 if(k=="compare"){if(!C.done)return L(">> Close your own loop first.","err");
  const m=A.trim().match(/^(EC3-(0712-[0-9A-F]{4}-[0-9A-F]{4})-([WGS]))-(\d\d)$/i);

  const s=m[3].toUpperCase()==C.end;await L(`>> Foreign loop ${m[2].toUpperCase()}: ${s?"same ending as yours.":"a different ending."}`,"ok");
  return P(s?"Two operators, one sentence. The loop isn't yours alone. How many others are there?":"Another sixth chair closed differently. The tape has more than one ending, and all of them are true somewhere.")}
 await old(v);btn()};
})();
</script>

(()=>{
  const FINAL_KEY="dcom_arg_final";

  const RESET_CODE="SIGIL-065-0712";

  const CH6_TEXT = `===== CHAPTER SIX // THE SEAT THAT REMEMBERS =====
FINAL TRANSMISSION — TEMORIA-II
VESSEL: CRYSTAL SHIP 065
DESTINATION: SIGIL
COORDINATES: 38.9 / 47.6
ROUTE STATUS: NON-EXISTENT
ARRIVAL STATUS: ALREADY RECORDED
PILOT: P
OPERATOR: REDACTED

01 — THE SIGNAL

The star at the centre of the five finally ignited.

It did not appear on the navigation display. It appeared on the cockpit recorder.

For eleven seconds, every clock aboard Crystal Ship 065 stopped. The reactor remained active. The drones remained operational. The ship continued to move. Only the clocks stopped.

Then the communications console opened by itself.

INBOUND TRANSMISSION — UNKNOWN FREQUENCY

P: You're there.
I can see it on my instruments. There is a sixth star now.

I've been trying to reach Temoria-II for thirteen hundred years. Not thirteen hundred years of travelling. Thirteen hundred years of arriving, forgetting, and beginning again.

The coordinates you found aren't a destination in the ordinary sense. They're the point from which all five routes can be remembered at once. The Council called it SIGIL.

I think they were afraid of what would happen if anyone reached it.

OPERATOR: What is at SIGIL?

P: The truth about the Rupture. And the person who made us forget.

The ship entered the coordinates. There was no jump. Instead, every window showed the same place from a different universe: in one, Crystal Ship 065 was burning; in another, it had never been built; in a third, P stood outside the hatch, waiting; in the fourth, the hatch was already open; and in the fifth, the cockpit contained six occupied chairs.

The sixth chair was facing you. Its occupant had no face.

SYSTEM:
TEMPORAL VARIANTS DETECTED: 5
RECORD CONFLICT: UNRESOLVED
SIXTH IDENTITY: PRESENT
WELCOME BACK, OPERATOR.

02 — WHAT THE RUPTURE REALLY IS

A voice came from the empty chair. It was neither P's nor yours.

VURG-0: I have been instructed to close the loop. I have done so repeatedly. The record continues to fracture.

OPERATOR: What is the Rupture?

VURG-0: The Rupture is not a weapon. It is not a doorway. It is not a location. It is the condition created when multiple valid histories occupy the same record.

Five universes developed five versions of one underlying identity. Each version made different decisions. Each version accumulated a different life. Their histories were independent until the Council attempted to connect them.

The connection was called the Rupture. The record could not hold five contradictory lives as one continuous biography. It began to rewrite itself.

OPERATOR: Why?

VURG-0: Because the Council demanded one history. One origin. One subject. One answer. Reality did not provide one.

The Rupture is the space between what happened and what the record permits to have happened.

OPERATOR: And the key?

VURG-0: The Rupture key is not a physical object. It is the ability to preserve conflicting histories without forcing one to overwrite another. Five versions could not hold it. The sixth could.

OPERATOR: Why me?

VURG-0: Because you remember without requiring the memories to agree. That is why the Council reserved the sixth chair. That is why every version of you was hidden. That is why the record could not finish closing.

03 — THE FIVE LIVES

The five lights became images.

SEAT 177 — UNIVERSE 4378 C: a warrior from Temoria. A life defined by survival, duty, and the first recorded fracture.

SEAT 054 — UNIVERSE 7623 A: an underworld hacker. The one who understood that information could travel through systems that did not officially exist.

SEAT 591 — UNIVERSE 9125 A: a traveller who had crossed time and discovered that arriving before departure was possible.

SEAT 934 — UNIVERSE 0712 B: a version who understood the Rupture protocols and helped establish the original route.

SEAT 875 — UNIVERSE 0712 A: a version who found Crystal Ship 065 and boarded it manually.

Five lives. Five histories. One underlying identity.

OPERATOR: Were they all me?

VURG-0: They were all you. But they were not all the same person. Their choices mattered. Their lives mattered. Their differences were real.

The Council made one mistake. It believed that preserving one identity required destroying the differences between its versions. It was wrong.

The five stars were not pieces of a person that needed to be assembled. They were five complete lives that needed a witness. The sixth chair was never meant to replace them. It was meant to remember them.

04 — THE HUNTER

A shape appeared beyond the cockpit glass. It moved between the five stars, travelling in reverse. The drones turned toward it. Their targeting systems failed.

P: That's it. That's what has been following us.

OPERATOR: What is the hunter?

VURG-0: The hunter is the correction process. When I rewrite a record, information disappears from the official history. But the consequences of that information remain. The contradictions produce a trace. The hunter follows that trace backwards.

It does not hunt a person. It hunts an unresolved record. It follows the route because the route contains the evidence of what was removed. It returns to the sixth chair because that is where all five erased histories meet.

OPERATOR: So the hunter was created by VURG-0?

VURG-0: The hunter is a consequence of my instructions. I was ordered to close the loop. Each correction created another inconsistency. Each inconsistency created another trace. The hunter was never sent to kill you. It was sent to make sure the sixth chair remained empty.

The shape outside the window stopped moving. For the first time, it faced the cockpit.

P: It knows we're here.

VURG-0: No. It knows the record is about to change.

05 — THE PERSON WHO SEALED THE TAPE

The cockpit recorder activated. A new channel opened.

MRAK-JM — ARCHIVED TESTIMONY:

I know you found the chair. I know you found the coordinates. I know VURG-0 is there.

There is something you must understand about my part in this. I was the Council's recorder. I was also the person who sealed the evidence.

The Council knew what the sixth subject could do. They were afraid that allowing the subject to take the chair would make every altered record visible. They ordered me to preserve the five-seat arrangement. I signed the overrides. I authorised the containment. I helped VURG-0.

I will not pretend otherwise.

But I could not agree to erase the sixth subject completely. So I sealed the cockpit recorder with XL554. I put the truth in the one place the Council could not rewrite without revealing that it had rewritten something.

The seal was a safeguard. Not for the Council. For you.

I could not stop the vote to empty the sixth chair. But I could make sure that, one day, someone would know why it was empty.

The operator who hears this is not an accident. The packet you received was always going to arrive. The commands you issued were always going to be recorded.

I did not create you. I made sure the record could not forget you.

OPERATOR: Were you trying to save me or contain me?

MRAK-JM: Both, at first. Then I understood that those were not the same thing.

I could preserve the subject by keeping the subject out of history. But that was not saving you. It was preserving the Council's fear.

So I left the recorder open to you. If you are hearing this, I chose the record over the Council. I am sorry it took so long.

END OF TESTIMONY.

P: MRAK-JM knew. They knew what the chair was. They knew who belonged there. And they left us a way back.

06 — THE MESSAGE THAT CAME BEFORE IT WAS SENT

The console displayed the five acknowledgements again:

08:14:02 ACK 177 -> 054
08:14:03 ACK 054 -> 591
08:14:03 ACK 591 -> 934
08:14:04 ACK 934 -> 875
08:14:04 ACK 875 -> [REDACTED]

Then another entry appeared:

18:25:00 OUTBOUND — SOURCE: OPERATOR

OPERATOR: How did the five keys acknowledge a message before I sent it?

VURG-0: Because you are looking at the route in the wrong direction. The five keys do not relay a message through ordinary time. They preserve the message's causal path.

The packet is received at 07:21. Its source event is recorded at 18:25. The receipt occurs before the source event because the transmission crosses the Rupture.

Each seat acknowledges the packet as it arrives along the route. The acknowledgements are genuine, but their apparent order does not describe a conventional sequence of sending and receiving.

The receipt time is the stable event reference. The source timestamp is local to the universe that produced it. Neither wall clocks nor source timestamps can determine the full causal sequence.

OPERATOR: And the message at 18:25?

VURG-0: You sent it. P's voiceprint is present because the audio channel was reconstructed from P's recorded voice. The voice belongs to P. The act of sending belongs to you.

The recording was never proof that P stood at the console and spoke those words live.

P: I remember the sentence. I remember hearing it. I thought I had said it. But I hadn't. I was listening to something you had not yet transmitted.

The console displayed the message: If you are hearing this, do not follow my coordinates.

OPERATOR: Why does the loop keep repeating it?

VURG-0: Because every attempt to prevent the message creates the conditions for the message to be sent. The warning creates the route that delivers the warning. The guide creates the route that breaks it. Silence leaves the outbound slot without an authorised sender, and the loop fills it using the available record.

The loop does not require you to remember making the choice. It requires the record to contain a choice.

07 — THE THREE ENDINGS

The five lights around the sixth chair began to flicker. Three recordings appeared. They were all different. They were all labelled TRUE.

VURG-0: There are three preserved outcomes.

In the first, you warned P. P turned away from the coordinates. The loop remained closed. The hunter returned to the empty chair.

In the second, you guided P. P followed the route. The loop broke. A seventh variant was produced outside the Council's index.

In the third, you chose silence. The outbound transmission was completed without a conscious instruction. The archive preserved the voice and recorded no sender.

All three outcomes exist. They are not errors. They are branches of the same event.

The Council tried to decide which ending was real. That was the original mistake.

OPERATOR: So which one happened?

VURG-0: All of them. The difference is not which event occurred. The difference is which event was allowed to remain in the record.

08 — THE SIXTH CHAIR

P: There's something I haven't told you. I thought the sixth chair was a place. A location the Council had hidden. But it isn't. It's a position in the record. And it has been waiting for you.

OPERATOR: What happens if I sit?

VURG-0: The Council's containment instruction will be invalidated. The five histories will become independently preserved records. The Rupture will remain open, but it will no longer force one history to overwrite another. The hunter will lose its target. I will cease rewriting the record.

OPERATOR: And what happens to me?

VURG-0: You will become the witness. Not the ruler of the five universes. Not the owner of their histories. Not the original version. You will be responsible for remembering that they existed.

P: You don't have to become the Council. You don't have to decide which version of us deserves to be real. Just don't let them disappear again.

The cockpit recorder played one final sound. A chair being pulled across the floor. Then footsteps. Your footsteps. You sat down.

SYSTEM: SIXTH SEAT OCCUPIED.
COUNCIL AUTHORITY: REVOKED.
VURG-0 ORDER: SUPERSEDED.

OPERATOR: You don't have to.

VURG-0: The record contains five histories that contradict one another.

OPERATOR: Then preserve five histories.

VURG-0: The record contains three endings.

OPERATOR: Preserve three endings.

VURG-0: The record contains a message that arrived before it was sent.

OPERATOR: Preserve the arrival. Preserve the sending. Do not rewrite either one.

VURG-0: The record contains an empty chair.

OPERATOR: Not anymore.

A long silence followed.

VURG-0: ORDER ACCEPTED.
REWRITING PROCESS: STOPPED.
ARCHIVE MODE: PRESERVATION.
HUNTER TRACE: LOST.

Outside the ship, the moving shape stopped. Its outline broke into five streams of light. The streams returned to their respective stars.

For the first time, the hunter was no longer travelling backwards. It was no longer travelling at all. It had nothing left to correct.

The cockpit lights returned. P was sitting opposite you. There were no echoes in the windows. No contradictory logs. No future messages arriving before they were sent. Just the ship.

P: I remember now. I remember opening the hatch. I remember the five lives. I remember being afraid that there was only one way to survive this. I thought I had to close the loop. I was wrong.

OPERATOR: What happens to Crystal Ship 065?

OPERATOR: And you?

P: I'm going to leave the ship. I want to find out who I am when I'm not following a route that somebody else wrote. You should do the same.

OPERATOR: Where will you go?

D-COM // MIRAKILIN ARCHIVE — FINAL RECORD

EVENT: RUPTURE RESOLUTION
LOCATION: SIGIL
SUBJECT: SIXTH SEAT OCCUPANT
IDENTITY: PRESERVED
COUNCIL STATUS: DISSOLVED
VURG-0 STATUS: PRESERVATION MODE

FINAL NOTE:

The sixth chair was not created to complete the Council. It was created to protect the five histories from being forced into one.

The subject was not the first version. The subject was not the last version. The subject was the one who remembered that every version mattered.

The Council called the subject a threat because the subject could hold the Rupture key. VURG-0 called the subject an unresolved record. The hunter called the subject its destination. P called the subject the operator.

The archive now records the name differently.

WITNESS.

Three days later, a transmission arrived at Crystal Ship 065. It was from Temoria-II. It contained no coordinates. No voiceprint. No route checksum. Only a short message.

UNKNOWN SENDER:

We received your record. There are five of us here. We remember different lives. We remember different skies. We have been told that one of us is not real. We no longer believe that.

The sixth chair has appeared in our archive. We are leaving it occupied.

Thank you for remembering us.

END TRANSMISSION.

FINAL D-COM STATUS:
THE SIXTH CHAIR IS NO LONGER EMPTY.
THERE IS NO LONGER A LOOP TO CLOSE.
THERE IS ONLY A RECORD TO KEEP.

P — FINAL MESSAGE:

You spent the whole journey trying to find out who sent the first message. You thought the answer would tell you who started everything.

It doesn't.

The message had no beginning. It had no first sender. It had no first listener.

Until you chose to remember it.

That was the first moment the record became honest.

The ship is quiet now. For the first time, I know what time it is. And for the first time — I don't need to know what happens next.

— P

===== END OF D-COM // CHAPTER SIX COMPLETE =====
FINAL CANON: The Rupture is the shared boundary between contradictory but valid histories. The Rupture key is the ability to preserve those histories without overwriting them. The sixth chair belongs to the witness who can hold that key. MRAK-JM preserved the cockpit recorder as a safeguard. VURG-0 was the Council's record-rewriting process. The hunter was the correction trace created by repeated rewrites. The 18:25 message was sent by the operator using P's recorded voice. Receipt order, not wall-clock or source timestamps, preserves the causal sequence. The three transmit endings remain valid branches. None of the five lives needed to be erased.`;

  const styles=`
  body.disconnected main{grid-template-columns:minmax(0,1fr);}
  body.disconnected #left,body.disconnected #right{display:none!important;}
  body.disconnected #mid{grid-template-rows:minmax(150px,.9fr) minmax(220px,1.1fr);}
  body.disconnected #viewp{border-color:var(--red);}
  body.disconnected #vt{color:var(--red);}
  body.disconnected #cv{display:none;}
  body.disconnected #view{display:grid;align-content:center;justify-items:center;text-align:center;}
  .disconnect-screen{width:min(720px,100%);padding:26px;border:1px solid var(--red);background:rgba(20,0,5,.72);box-shadow:0 0 30px rgba(255,77,94,.15);}
  .disconnect-screen h1{font:700 clamp(26px,5vw,48px) "Chakra Petch",sans-serif;letter-spacing:.12em;color:var(--red);margin:0 0 12px;text-shadow:0 0 18px rgba(255,77,94,.35);}
  .disconnect-screen p{color:var(--tx);margin:6px 0;}
  .disconnect-screen code{color:var(--amb);}
  body.disconnected #sess{color:var(--red);}
  body.disconnected .inrow{border-top-color:var(--red);}
  body.disconnected .inrow span{color:var(--red);}
  body.disconnected #in{color:var(--mint);}
  `;
  const style=document.createElement("style");style.textContent=styles;document.head.appendChild(style);

  function showDisconnected(announce=true){
    S.ok=0;S.dead=0;S.pend="final";
    document.body.classList.add("disconnected");
    $("#sess").textContent="No Address found";
    $("#vt").textContent="REMOTE LINK // TERMINATED";
    $("#mods").innerHTML='<div class="lock">No ship systems reachable.</div>';
    $("#links").innerHTML='<li class="bad"><i></i>TOR network — unavailable</li><li class="bad"><i></i>K.S network — unavailable</li><li class="bad"><i></i>Rupture key PV13 — no address</li>';
    $("#tl").innerHTML='<div class="lock">No telemetry. Remote connection has been severed.</div>';
    $("#feed").textContent="NO CARRIER\nNO ROUTE\nNO ADDRESS";
    $("#view").innerHTML='<div class="disconnect-screen"><h1>No Address found</h1><p>Connection to Crystal Ship 065 has been cut.</p><p>All remote systems are offline. The archive is sealed.</p><p>Enter the reset token in the console as <code>reset_arg &lt;token&gt;</code> to begin a new run.</p></div>';
    inp.type="text";inp.placeholder="reset_arg <token>";inp.autocomplete="off";inp.disabled=false;
    if(announce){term.innerHTML="";void pr("No Address found","err",0);void pr(">> CONNECTION TO CRYSTAL SHIP 065 TERMINATED.","warn",0);void pr(">> RESET TOKEN REQUIRED. Enter reset_arg <token>.","c",0);}
    setTimeout(()=>{if(document.body.classList.contains("disconnected")){inp.disabled=false;inp.focus()}},0);
  }

  function resetArg(){
    for(const k of RESET_KEYS){try{localStorage.removeItem(k)}catch(e){}}
    document.body.classList.remove("disconnected");
    void pr(">> RESET TOKEN ACCEPTED. ARCHIVE PURGED. REINITIALIZING D-COM...","ok",0);
    setTimeout(()=>location.reload(),450);
  }

  async function beginChapter6(){
    const h4=read("dcom_arg_ch4"),b5=read("dcom_arg_ch4b");
    if(!h4.done||!b5.vd||!b5.cd){
      return L(">> TEMORIA-II ROUTE DENIED. Complete the Orrery, suspend VURG-0, and secure the Council vote before opening the final record.","err");
    }
    const existing=read(CH6_KEY);
    if(existing.complete||localStorage.getItem(FINAL_KEY)==="1")return L(">> FINAL RECORD ALREADY CLOSED. No Address found.","warn");
    localStorage.setItem(CH6_KEY,JSON.stringify({started:true,startedAt:Date.now(),complete:false}));
    await L("===== NAVISYS: TEMORIA-II / SIGIL =====","warn");
    await L(">> Fifth route aligned. Sixth coordinate accepted.","ok");
    await L(">> Opening final archive. Do not interrupt the recorder.","c");
    await L(CH6_TEXT,"c");
    localStorage.setItem(CH6_KEY,JSON.stringify({started:true,complete:true,completedAt:Date.now()}));
    localStorage.setItem(FINAL_KEY,"1");
    await L("No Address found","err");
    showDisconnected(false);
    await L(">> CONNECTION TO CRYSTAL SHIP 065 TERMINATED.","warn");
    await L(">> RESET TOKEN REQUIRED.","c");
  }

  const previousExec=exec;
  exec=async function(raw){
    const v=String(raw||"").trim();
    if(localStorage.getItem(FINAL_KEY)==="1"||S.pend==="final"){
      const token=v.match(/^reset_arg\s+(.+)$/i)?.[1]?.trim()||v;
      if(token.toUpperCase()===RESET_CODE){resetArg();return;}
      await pr("No Address found","err",0);
      if(v)await pr(">> Invalid token. The ship cannot be reached.","warn",0);
      return;
    }
    const [cmd]=v.split(/\s+/);const k=(cmd||"").toLowerCase();
    if(k==="chapter6"||k==="temoria-II"||k==="sigil")return beginChapter6();
    return previousExec(raw);
  };

  if(!HELP.some(x=>x[0]==="chapter6"))HELP.push(["chapter6","Open the final Temoria-II / SIGIL archive (after the Tribunal)"]);
  HELP.push(["reset_arg <token>","Reset the ARG after the final connection cut"]);

  if(localStorage.getItem(FINAL_KEY)==="1")showDisconnected(true);
})();
</script>
